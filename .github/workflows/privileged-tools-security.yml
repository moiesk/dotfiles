name: privileged tool security

on:
  pull_request:
    paths:
      - ".github/workflows/privileged-tools-security.yml"
      - "agent-tools/package.json"
      - "agent-tools/package-lock.json"
      - "flake.lock"
      - "flake.nix"
      - "home.nix"
      - "scripts/check-privileged-tool-releases.sh"
      - "scripts/check-firstmate-floor-exceptions.sh"
      - "scripts/firstmate-tool-floors.tsv"
      - "security/firstmate-floor-exceptions.json"
      - "scripts/govulncheck-policy.sh"
      - "security/go-vulnerability-exceptions.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/privileged-tools-security.yml"
      - "agent-tools/package.json"
      - "agent-tools/package-lock.json"
      - "flake.lock"
      - "flake.nix"
      - "home.nix"
      - "scripts/check-privileged-tool-releases.sh"
      - "scripts/check-firstmate-floor-exceptions.sh"
      - "scripts/firstmate-tool-floors.tsv"
      - "security/firstmate-floor-exceptions.json"
      - "scripts/govulncheck-policy.sh"
      - "security/go-vulnerability-exceptions.json"
  schedule:
    - cron: "41 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pins
        run: |
          echo "treehouse=$(jq -r '.nodes.treehouse.locked.rev' flake.lock)" >> "$GITHUB_OUTPUT"
          echo "no_mistakes=$(jq -r '.nodes["no-mistakes"].locked.rev' flake.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kunchenguid/treehouse
          ref: ${{ steps.pins.outputs.treehouse }}
          path: upstream/treehouse
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kunchenguid/no-mistakes
          ref: ${{ steps.pins.outputs.no_mistakes }}
          path: upstream/no-mistakes
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.13
          cache-dependency-path: |
            upstream/treehouse/go.sum
            upstream/no-mistakes/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: ./scripts/govulncheck-policy.sh treehouse upstream/treehouse
      - run: ./scripts/govulncheck-policy.sh no-mistakes upstream/no-mistakes
      - run: go build -trimpath -o "$RUNNER_TEMP/treehouse" .
        working-directory: upstream/treehouse
      - run: go build -trimpath -o "$RUNNER_TEMP/no-mistakes" ./cmd/no-mistakes
        working-directory: upstream/no-mistakes
      - run: |
          "$RUNNER_TEMP/treehouse" --help
      - run: |
          "$RUNNER_TEMP/no-mistakes" --help

  stable-release-policy:
    runs-on: ubuntu-latest
    steps:
      # Floor exception validation reads the historical pin preceding the
      # adopted version out of commit history, so the default shallow checkout
      # is not enough.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: agent-tools/package-lock.json
      - run: npm ci
        working-directory: agent-tools
      - run: ./scripts/check-privileged-tool-releases.sh
        env:
          GH_AXI_BIN: ${{ github.workspace }}/agent-tools/node_modules/.bin/gh-axi
          GH_TOKEN: ${{ github.token }}
