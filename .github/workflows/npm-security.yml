name: npm security

on:
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/npm-security.yml"
      - "agent-tools/**"
      - "home/.config/opencode/**"
      - "scripts/npm-audit.sh"
      - "security/npm-audit-exceptions.json"
  push:
    branches:
      - main
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/npm-security.yml"
      - "agent-tools/**"
      - "home/.config/opencode/**"
      - "scripts/npm-audit.sh"
      - "security/npm-audit-exceptions.json"
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - agent-tools
          - home/.config/opencode
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Configure isolated agent tools prefix
        if: matrix.project == 'agent-tools'
        run: echo "AGENT_TOOLS_PREFIX=$RUNNER_TEMP/agent-tools" >> "$GITHUB_ENV"
      - name: Install locked agent tools and rolling Pi in isolation
        if: matrix.project == 'agent-tools'
        run: |
          mkdir -p "$AGENT_TOOLS_PREFIX"
          cp package.json package-lock.json .npmrc "$AGENT_TOOLS_PREFIX/"
          (cd "$AGENT_TOOLS_PREFIX" && npm ci)
          npm install --prefix "$AGENT_TOOLS_PREFIX" @earendil-works/pi-coding-agent@latest
      - name: Install locked OpenCode dependencies
        if: matrix.project == 'home/.config/opencode'
        run: npm ci
      - run: |
          if [[ "${{ matrix.project }}" == "agent-tools" ]]; then
            audit_prefix="$AGENT_TOOLS_PREFIX"
          else
            audit_prefix="$PWD"
          fi
          "$GITHUB_WORKSPACE/scripts/npm-audit.sh" "$audit_prefix"
          npm audit signatures --prefix "$audit_prefix"

  smoke-test-agent-tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: agent-tools/package-lock.json
      - name: Configure isolated agent tools prefix
        run: echo "AGENT_TOOLS_PREFIX=$RUNNER_TEMP/agent-tools" >> "$GITHUB_ENV"
      - run: |
          mkdir -p "$AGENT_TOOLS_PREFIX"
          cp package.json package-lock.json .npmrc "$AGENT_TOOLS_PREFIX/"
          (cd "$AGENT_TOOLS_PREFIX" && npm ci)
      # Pi is a first-party harness (decisions #34/#36): it rolls to @latest on
      # top of the pinned, lockfile-driven tools rather than living in
      # package.json/-lock, matching scripts/post-switch.sh. Install it here so
      # the smoke test exercises the same rolling install and package-managed
      # executable used by the Nix wrapper in home.nix.
      - run: npm install --prefix "$AGENT_TOOLS_PREFIX" @earendil-works/pi-coding-agent@latest
      - run: '"$AGENT_TOOLS_PREFIX/node_modules/.bin/pi" --version'
      - run: '"$AGENT_TOOLS_PREFIX/node_modules/.bin/gh-axi" --help'
      - run: '"$AGENT_TOOLS_PREFIX/node_modules/.bin/chrome-devtools-axi" --help'
      - run: '"$AGENT_TOOLS_PREFIX/node_modules/.bin/lavish-axi" --help'
      - run: '"$AGENT_TOOLS_PREFIX/node_modules/.bin/quota-axi" --help'
      - run: '"$AGENT_TOOLS_PREFIX/node_modules/.bin/tasks-axi" --help'
