name: npm security

on:
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/npm-security.yml"
      - "agent-tools/**"
      - "home/.config/opencode/**"
      - "scripts/npm-audit.sh"
      - "security/npm-audit-exceptions.json"
  push:
    branches:
      - main
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/npm-security.yml"
      - "agent-tools/**"
      - "home/.config/opencode/**"
      - "scripts/npm-audit.sh"
      - "security/npm-audit-exceptions.json"
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - agent-tools
          - home/.config/opencode
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: |
          "$GITHUB_WORKSPACE/scripts/npm-audit.sh" "$PWD"
      - run: npm audit signatures

  smoke-test-agent-tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-tools
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: agent-tools/package-lock.json
      - run: npm ci
      - run: node_modules/.bin/pi --version
      - run: node_modules/.bin/gh-axi --help
      - run: node_modules/.bin/chrome-devtools-axi --help
      - run: node_modules/.bin/lavish-axi --help
      - run: node_modules/.bin/quota-axi --help
      - run: node_modules/.bin/tasks-axi --help
