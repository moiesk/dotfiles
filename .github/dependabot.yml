version: 2
updates:
  - package-ecosystem: npm
    directory: /agent-tools
    schedule:
      interval: daily
      time: "09:00"
      timezone: America/New_York
    cooldown:
      default-days: 7
    groups:
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"
      routine-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /home/.config/opencode
    schedule:
      interval: daily
      time: "09:00"
      timezone: America/New_York
    cooldown:
      default-days: 7
    groups:
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"
      routine-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
